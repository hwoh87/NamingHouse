name: Android Internal Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g. 1.8.0)"
        required: true
      version_code:
        description: "Version code (integer, must increase)"
        required: true
  push:
    tags:
      - "v*"

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        env:
          IN_NAME: ${{ github.event.inputs.version_name }}
          IN_CODE: ${{ github.event.inputs.version_code }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -n "$IN_NAME" ]; then
            NAME="$IN_NAME"
          elif [[ "$REF" == refs/tags/* ]]; then
            # Strip a leading "v" so tag v1.8.0 bakes a clean versionName 1.8.0.
            NAME="${REF_NAME#v}"
          else
            NAME="1.0.0"
          fi
          if [ -n "$IN_CODE" ]; then
            CODE="$IN_CODE"
          else
            CODE="$RUN_NUMBER"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          # deploy-internal.sh parses this exact line to compute the next code.
          echo "Resolved versionName=$NAME versionCode=$CODE"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          # No Gemfile.lock is committed on purpose. A lock resolved under an old
          # Ruby pins gems (e.g. CFPropertyList 3.0.9) that reject Ruby 3.3 and
          # break this step. Let bundler resolve fresh each run.
          bundler: latest
          bundler-cache: true
          cache-version: 1

      - name: Decode Android Keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"; exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore

      # No google-services step here — this app has no Firebase dependency
      # (unlike 삼라만상/마이타로). Don't copy one in without adding the plugin.
      - name: Build release bundle (AAB)
        run: |
          ./gradlew :app:bundleRelease \
            -PVERSION_NAME=${{ steps.ver.outputs.name }} \
            -PVERSION_CODE=${{ steps.ver.outputs.code }} \
            -PRELEASE_STORE_FILE=$GITHUB_WORKSPACE/release.keystore \
            -PRELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }} \
            -PRELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }} \
            -PRELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload to Play Console (internal track)
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          SUPPLY_AAB: ${{ github.workspace }}/app/build/outputs/bundle/release/app-release.aab
          SUPPLY_TRACK: internal
        run: bundle exec fastlane internal_release
